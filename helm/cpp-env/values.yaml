# ═══════════════════════════════════════════════════════════════
# cpp-env — a whole test environment in one namespace.
#
# Deploy a new env (its own namespace; env name drives the *.<env> domain):
#   helm dependency build ./helm/cpp-env
#   helm upgrade --install stage ./helm/cpp-env \
#     -n env-stage --create-namespace \
#     --set env=stage \
#     --set mi-fitness-api-worker.app.baseUrl=https://app.stage.example.com \
#     --set credentials.dbPassword="$DB_PASS" \
#     --set credentials.redisPassword="$REDIS_PASS" \
#     --set credentials.jwtSecret="$JWT_SECRET" \
#     --set mi-fitness-api.externalDatabase.password="$DB_PASS" \
#     --set mi-fitness-api.externalRedis.password="$REDIS_PASS" \
#     --set mi-fitness-api.auth.jwtSecret="$JWT_SECRET" \
#     --set mi-fitness-api-worker.externalDatabase.password="$DB_PASS" \
#     --set mi-fitness-api-worker.externalRedis.password="$REDIS_PASS" \
#     --set mi-fitness-api-worker.auth.jwtSecret="$JWT_SECRET"
#
# Credentials are EMPTY by default and REQUIRED at install (generate throwaway
# ones like scripts/deploy-demo.sh does). They used to default to public
# test-* placeholders, and a downstream production release silently inherited
# the placeholder JWT key — tokens signed with a string published in this repo
# verified against a live API (cyber-accountant e19985b). Empty defaults turn
# that silent takeover into a visible fail-close: the API refuses to boot on an
# empty/short JWT secret (src/security/Auth.hpp), and scripts/check-helm-render.sh
# asserts no tracked overlay ever carries a non-empty credential again.
#
# Everything else (DB rw/ro URLs, Redis Sentinel, Kafka, OTLP, Mailpit,
# ingress hosts) is wired automatically below. Each env lives in its own
# namespace, so service names are fixed and collision-free across envs.
# ═══════════════════════════════════════════════════════════════

# Environment name — the only required knob. Drives api.<env>/app.<env>/… hosts.
env: dev
baseDomain: example.com

# ── Ingress (umbrella owns all ingress; subchart ingress is disabled) ──
ingress:
  enabled: true          # false → release brings its own real-domain Ingress; the api.<env>/app.<env> placeholders don't render
  # Edge request-body cap (nginx.ingress.kubernetes.io/proxy-body-size).
  # ingress-nginx defaults to 1m, which 413s uploads at the edge before the
  # frontend nginx (6m) or the app's 5 MB cap run. Keep >= the frontend cap.
  proxyBodySize: "6m"
  className: nginx
  clusterIssuer: letsencrypt-prod        # cert-manager ClusterIssuer (DNS-01 for wildcard)
  wildcardTlsSecret: ""                  # set to reuse a pre-issued *.<env> cert; "" → per-host certs
  externalDnsTarget: ""                  # external-dns A target (cluster ingress IP); "" → omit annotations

# ── Per-env credentials — EMPTY on purpose, supply at install via --set (see
# header). Used by the infra templates below AND mirrored into the subchart
# password fields further down; keep both in sync. Committing a working value
# here hands it to every release that forgets to override it — that is exactly
# the incident these defaults used to cause. check-helm-render.sh gates it. ──
credentials:
  dbPassword: ""
  redisPassword: ""
  jwtSecret: ""

# ── Infra toggles + sizing ──
postgres:
  enabled: true         # false → point the subcharts at an existing/shared Postgres instead
  instances: 2          # CNPG: 1 primary + (instances-1) replicas → pg-rw / pg-ro
  storageSize: 2Gi
  storageClass: ""      # "" → cluster default
redis:
  enabled: true         # single master + 3 Sentinels (mymaster)
kafka:
  enabled: true         # single-broker KRaft
mailpit:
  enabled: true         # SMTP sink + web UI (mail.<env>)
  ingress:
    # OFF by default: Mailpit's inbox holds reset/confirm/invite tokens. Do NOT
    # publish it to the internet without auth. Flip true only for trusted envs.
    enabled: false      # publish mail.<env> ingress (unauthenticated UI)
jaeger:
  enabled: true         # all-in-one + UI (jaeger.<env>), OTLP on :4318
  ingress:
    # OFF by default: Jaeger UI exposes request traces. Reach it via
    # `kubectl port-forward svc/jaeger 16686` instead of a public ingress.
    enabled: false      # publish jaeger.<env> ingress (unauthenticated UI)

# ── Demo reset (public demo only): periodically wipe user data + reseed so
# abuse/clutter doesn't persist. OFF by default; values-demo.yaml enables it. ──
demoReset:
  enabled: false
  schedule: "0 */6 * * *"           # every 6 hours
  psqlImage: postgres:16-alpine
  adminEmail: admin@demo.tarassov.me
  adminPassword: change-me-demo-pass      # demo admin is intentionally public (README)
  seedCount: 8

# ═══════════════════════════════════════════════════════════════
# Subchart wiring — fixed in-namespace service names, mirrored creds.
# ═══════════════════════════════════════════════════════════════

mi-fitness-api:
  fullnameOverride: api
  replicaCount: 1
  image:
    repository: ghcr.io/your-registry/your-project/mi-fitness-api
    # NOTE: release.yml strips the tag's leading v — GHCR carries 1.5.3, not
    # v1.5.3. A v-prefixed pin here pulls a tag that does not exist
    # (downstream bump: cyber-accountant 80996a7).
    tag: "1.7.2"
    pullPolicy: Always
  nodeSelector:
    kubernetes.io/arch: amd64
  ingress:
    enabled: false                       # umbrella owns ingress
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 384Mi }
  externalDatabase:
    host: pg-rw
    port: 5432
    name: app
    user: app
    password: ""                         # == credentials.dbPassword (set via --set)
    poolSize: 5
    replicaHost: pg-ro
    migrationsEnabled: false
  migrations:
    runAsInitContainer: true
  externalRedis:
    url: "tcp://redis:6379"
    password: ""                           # == credentials.redisPassword (set via --set)
    useSentinel: true
    masterName: mymaster
    sentinelNodes: "redis-sentinel:26379"
    poolSize: 5
  externalKafka:
    enabled: true
    brokers: "kafka:9092"
    producerEnabled: false
    consumerEnabled: false
  jobs:
    enabled: true
  # The umbrella always ships mi-fitness-api-worker, so the API must ENQUEUE account emails
  # (confirm/reset/invite) for the worker to deliver — not try to send inline via
  # its placeholder SMTP. Without viaJobs=true the API's dispatch() falls to
  # deliver_now() against a disabled Mailer and the mail is silently dropped
  # (no job, no email). The worker (mi-fitness-api-worker.mail.*) does the real delivery.
  mail:
    enabled: true
    viaJobs: true
  tracing:
    enabled: true
    otlpEndpoint: "http://jaeger:4318/v1/traces"
  auth:
    mode: jwt
    jwtSecret: ""        # == credentials.jwtSecret (set via --set; empty fail-closes at boot)
    cookies:
      enabled: true
      secure: true
      samesite: Lax
  serviceMonitor:
    enabled: false

mi-fitness-api-worker:
  fullnameOverride: worker
  replicaCount: 1
  image:
    repository: ghcr.io/your-registry/your-project/mi-fitness-api-worker
    tag: "1.7.2"       # unprefixed — see the mi-fitness-api image note
    pullPolicy: Always
  nodeSelector:
    kubernetes.io/arch: amd64
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { cpu: "1", memory: 384Mi }
  externalDatabase:
    host: pg-rw
    port: 5432
    name: app
    user: app
    password: ""       # == credentials.dbPassword (set via --set)
    poolSize: 5
    replicaHost: pg-ro
  externalRedis:
    url: "tcp://redis:6379"
    password: ""       # == credentials.redisPassword (set via --set)
    useSentinel: true
    masterName: mymaster
    sentinelNodes: "redis-sentinel:26379"
    poolSize: 5
  jobs:
    enabled: true
  auth:
    mode: jwt
    jwtSecret: ""      # == credentials.jwtSecret (set via --set)
    jwtIssuer: ""
    jwtAudience: ""
  # The public URL baked into email links — the ONE field that needs the env
  # name. Override at install: --set mi-fitness-api-worker.app.baseUrl=https://app.<env>.example.com
  app:
    baseUrl: "https://app.dev.example.com"
    name: App
  mail:
    enabled: true
    viaJobs: true
    smtpHost: mailpit
    smtpPort: 1025
    smtpUsername: ""
    smtpUseTls: false
    from: noreply@example.com
    fromName: App
    subjectPrefix: "[test] "
  tracing:
    enabled: true
    otlpEndpoint: "http://jaeger:4318/v1/traces"
  serviceMonitor:
    enabled: false

cpp-frontend:
  fullnameOverride: web
  replicaCount: 1
  image:
    repository: ghcr.io/your-registry/your-project/mi-fitness-api-frontend
    tag: "1.7.2"       # unprefixed — see the mi-fitness-api image note
    pullPolicy: Always
  nodeSelector:
    kubernetes.io/arch: amd64
  backend:
    service: api          # mi-fitness-api fullnameOverride
    port: 8080
  ingress:
    enabled: false        # umbrella owns ingress
