name: Gates nightly

# Rot insurance for the check-* gates. In per-PR CI the gate-selftest job is
# self-scoped to scripts/**, .github/workflows/**, helm/** — this nightly run
# is the unconditional backstop that proves the gates still BITE even when
# nobody has touched them for weeks (a gate only ever run against healthy
# trees is indistinguishable from `exit 0`).
#
# Also home to the swagger-sri-guard job: nothing in per-PR CI can verify the
# swagger-ui-dist CDN pin against its sha384 SRI hashes (that needs the
# network), so the nightly re-downloads the pinned files and fails on drift.
on:
  schedule:
    - cron: '23 3 * * *'  # daily, off the top of the hour
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate-selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Install helm + yq
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Gate selftest (20 planted breakages must be caught)
        run: ./scripts/check-selftest.sh
      - name: Module dependency DAG gate
        run: ./scripts/check-module-deps.sh

  # The Swagger UI page (src/api/Middleware.cpp) pins swagger-ui-dist to an
  # exact CDN version with sha384 SRI hashes. No PR gate checks those hashes —
  # they only fail in the browser — so this job downloads the pinned files
  # from the CDN and compares. Catches BOTH failure modes: a Renovate version
  # bump merged without re-pinning the hashes, and the CDN serving different
  # bytes for a version it already served (which would be an incident, not a
  # chore). Re-pin instructions live in the comment at the pin.
  swagger-sri-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Swagger UI CDN pin vs SRI hashes
        run: |
          set -euo pipefail
          src=src/api/Middleware.cpp
          vers=$(grep -oE 'swagger-ui-dist@[0-9]+\.[0-9]+\.[0-9]+' "$src" | cut -d@ -f2 | sort -u)
          if [ "$(printf '%s\n' "$vers" | wc -l)" -ne 1 ]; then
            echo "::error::expected exactly one swagger-ui-dist version pinned in $src, got: $vers"
            exit 1
          fi
          fail=0
          for f in swagger-ui.css swagger-ui-bundle.js; do
            want=$(grep -F "/${f}\" integrity=\"sha384-" "$src" | grep -oE 'sha384-[A-Za-z0-9+/]+={0,2}' | head -n1)
            if [ -z "$want" ]; then
              echo "::error::no sha384 integrity attribute found for ${f} in $src"
              exit 1
            fi
            got="sha384-$(curl -fsSL --retry 3 "https://unpkg.com/swagger-ui-dist@${vers}/${f}" \
              | openssl dgst -sha384 -binary | openssl base64 -A)"
            if [ "$want" = "$got" ]; then
              echo "OK: ${f}@${vers} matches its SRI pin"
            else
              echo "::error::pin/hash drift: ${f}@${vers} — $src pins ${want}, CDN serves ${got}. Re-pin both hashes per the comment at the pin in $src."
              fail=1
            fi
          done
          exit "$fail"
