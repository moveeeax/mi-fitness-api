          else
            # push: first-parent diff of the pushed head (checkout fetched
            # depth 2). HEAD^ is absent on a root commit → fail open below.
            changed=$(git diff --name-only HEAD^..HEAD 2>/dev/null) || changed=""
          fi
          if [ -z "$changed" ]; then
            echo "could not determine the changed files — failing open, job runs in full"
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf 'changed files:\n%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -qE "$RELEVANT"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "paths untouched — verified nothing this job covers is affected; exiting green"
          fi

      - name: Set up Docker Buildx
        if: steps.scope.outputs.relevant == 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Expose Actions cache env for sccache
