# Nightly benchmark trend on master. Shared-runner numbers are NOISY — this
# workflow tracks trends and alerts on >30% regressions; it never gates PRs.
# Absolute numbers: run `make bench` on your own hardware (docs/BENCHMARKS.md).
name: bench-nightly

on:
  schedule:
    - cron: '20 3 * * *'
  workflow_dispatch:

permissions:
  contents: write   # push data points to gh-pages

concurrency:
  group: bench-nightly
  cancel-in-progress: false

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # workflow_dispatch from a non-master branch must not pollute the master
    # trend — the chart and alerts are only meaningful for master history.
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build runtime image (dep layer from cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          load: true
          tags: mi-fitness-api:bench
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache

      - name: Install wrk and jq
        run: sudo apt-get update && sudo apt-get install -y wrk jq

      - name: Run benchmarks
        env:
          BENCH_IMAGE: mi-fitness-api:bench
        run: ./scripts/bench-ci.sh

      - name: Publish throughput trend
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: Throughput
          tool: customBiggerIsBetter
          output-file-path: bench-out/bench-bigger.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '130%'
          comment-on-alert: true
          fail-on-alert: false

      - name: Publish latency and footprint trend
        uses: benchmark-action/github-action-benchmark@4322e5726e6334590d251fc4f92bec0efafc45dc  # v1.22.2
        with:
          name: Latency & footprint
          tool: customSmallerIsBetter
          output-file-path: bench-out/bench-smaller.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          alert-threshold: '130%'
          comment-on-alert: true
          fail-on-alert: false

      - name: Dump container logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env logs --tail 50 app || true
          docker compose -f docker/docker-compose.yml --env-file docker/.env logs --tail 50 postgres || true
          docker compose -f docker/docker-compose.yml --env-file docker/.env logs --tail 50 redis || true

      - name: Upload bench output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: bench-out
          path: bench-out/
          if-no-files-found: ignore

      - name: Tear down compose stack
        if: always()
        run: make down || true
